name: "Setup Manim Environment"
description: "Install Python and the system dependencies Manim needs on Ubuntu runners (cairo/pango, optional TeX/ffmpeg/xvfb stack)"
branding:
  icon: film
  color: gray-dark

inputs:
  python-version:
    description: "Python version to install"
    required: false
    default: "3.14"
  install-full-deps:
    description: "Install the full system stack (TeX, ffmpeg, xvfb, OpenGL/X11 headers, CJK/Arabic fonts) for rendering and test workflows"
    required: false
    default: "false"
  install-editable:
    description: "Run pip install -e \".[dev]\" from the working directory once the environment is ready"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango1.0-dev libcairo2-dev libgirepository1.0-dev pkg-config
        if [ "${{ inputs.install-full-deps }}" = "true" ]; then
          sudo apt-get install -y \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev \
            xvfb \
            ffmpeg \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended dvisvgm texlive-xetex texlive-lang-chinese \
            fonts-noto-cjk \
            fonts-hosny-amiri \
            fonts-jetbrains-mono
        fi
      shell: bash

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install opencv-python-headless
        if [ "${{ inputs.install-editable }}" = "true" ]; then
          pip install -e ".[dev]"
        fi
      shell: bash
